<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="icon" href="https://i.imgur.com/HeIi0wU.png">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FutureBook ⚡</title>

<link rel="stylesheet" href="style.css"/>

<!-- FONT AWESOME (Facebook-style icons) -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- ================= SPLASH SCREEN ================= -->
<div id="splashScreen">
  <img src="logo.png" class="splash-logo" />
  <h2>FutureBook</h2>
</div>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="auth-logo">
    <img src="logo.png">
    <h2>FutureBook</h2>
  </div>

  <input id="nameInput" placeholder="Enter your name" />
  <input id="passwordInput" type="password" placeholder="Password" />

  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Login</button>
</div>



<!-- ================= APP ================= -->
<div class="app" id="app" style="display:none;">

 
<!-- FACEBOOK TOP BAR -->

<div class="top-navbar">

  <div class="nav-left">
    <h2>FutureBook</h2>
  </div>

  <div class="nav-center">

    <input
      type="text"
      id="mainSearch"
      placeholder="Search FutureBook"
      onkeyup="searchUsersMain()"
    >

  </div>

  <div class="nav-right">
      <button onclick="showReels()">
🎬 Reels
</button>


    <div onclick="showHome()">
      <i class="fa-solid fa-house"></i>
    </div>

    <div onclick="showMessages()">
      <i class="fa-solid fa-message"></i>
    </div>

    <div onclick="showNotificationsPage()">
      <i class="fa-solid fa-bell"></i>
    </div>

    <div onclick="showProfile()">
      <i class="fa-solid fa-user"></i>
    </div>
<div onclick="showSettings()">
  <i class="fa-solid fa-gear"></i>
</div>
  </div>

</div>

<div id="searchResults"></div>
<!-- CENTER -->
<div class="fb-center">




  <!-- HOME -->
  <div id="homeView">

    <!-- NOVA / STORIES -->
    <div class="nova-bar">

      <div class="nova-card create-nova">
        <div class="nova-plus">+</div>
        <span>Create Nova</span>
      </div>

    </div>


    <div id="reelsView" style="display:none;">

<div id="reelsContainer"></div>

</div>


    <!-- CREATE POST -->
<div class="fb-post-box" onclick="openPostModal()">

  <div class="fb-post-top">

    <img
      src="https://i.imgur.com/HeIi0wU.png"
      class="fb-post-avatar"
    >

    <input
      type="text"
      placeholder="What's on your mind?"
      readonly
    >

  </div>

  <div class="fb-post-bottom">

    <div class="fb-post-action live">
      🎥 Live Video
    </div>

    <div class="fb-post-action photo">
      📷 Photo/video
    </div>

    <div class="fb-post-action feeling">
      😊 Feeling/activity
    </div>

  </div>

</div>

    <!-- POSTS -->
    <div id="posts"></div>

  </div>

  <!-- CHAT -->


<!-- CHAT VIEW -->
<div id="chatView" style="display:none;">

  <!-- FRIENDS SIDEBAR -->
  <div class="messenger-layout">

    <!-- LEFT SIDEBAR -->
    <div class="messenger-sidebar">

      <!-- HEADER -->
      <div class="messenger-header">
        <h2>Chats</h2>
      </div>

      <!-- STORIES -->
      <div class="nova-bar">

        <!-- STORY 1 -->
        <div class="nova-item active">

          <div class="nova-avatar">
            <img src="https://i.imgur.com/HeIi0wU.png">
          </div>

          <div class="nova-name">
            Nova
          </div>

        </div>

        <!-- STORY 2 -->
        <div class="nova-item">

          <div class="nova-avatar">
            <img src="https://i.imgur.com/HeIi0wU.png">
          </div>

          <div class="nova-name">
            Future
          </div>

        </div>

      </div>

      <!-- FRIEND LIST -->
      <div id="friendsList" class="friends-list"></div>

    </div>

    <!-- CHAT AREA -->
    <div class="messenger-chat-area">

      <!-- EMPTY CHAT -->
      <div id="emptyChat" class="empty-chat-box">

        <i class="fa-solid fa-comments"></i>

        <h2>Your Messages</h2>

        <p>Select a chat to start messaging</p>

      </div>

      <!-- ACTIVE CHAT -->
      <div id="activeChatBox" style="display:none;">

        <!-- TOPBAR -->
        <div class="chat-topbar">

          <div class="chat-user-info">

            <img
              src="https://i.imgur.com/HeIi0wU.png"
              id="chatUserPic"
            >

            <div>
              <h3 id="chatTitle"></h3>
              <span>Active now</span>
            </div>

          </div>

          <!-- RIGHT ACTIONS -->
          <div class="chat-top-actions">

            <button class="top-call-btn">
              <i class="fa-solid fa-phone"></i>
            </button>

            <button class="top-call-btn">
              <i class="fa-solid fa-video"></i>
            </button>

          </div>

        </div>

        <!-- MESSAGES -->
        <div id="messagesContainer"></div>

        <!-- TYPING -->
        <div id="typingIndicator"></div>

        <!-- INPUT -->
        <div
          id="chatInputArea"
          class="chat-input-area"
          style="display:none;"
        >

        
          <div id="voiceRecorder">

  <!-- NORMAL CHAT -->
  <div id="normalChatUI">

    <input 
      type="text" 
      id="chatInput" 
      placeholder="Message..."
    />

    <!-- MIC -->
    <button id="micBtn" class="chat-action-btn">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a1 1 0 1 1 2 0 7 7 0 0 1-6 6.92V21h3a1 1 0 1 1 0 2H8a1 1 0 1 1 0-2h3v-2.08A7 7 0 0 1 5 12a1 1 0 1 1 2 0 5 5 0 0 0 10 0z"/>
      </svg>

    </button>

  </div>

  <!-- RECORDING -->
  <div id="recordingUI">

    <!-- PAUSE -->
    <button id="pauseRecordBtn" class="chat-action-btn">

      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
        <path d="M6 5h4v14H6zm8 0h4v14h-4z"/>
      </svg>

    </button>

    <!-- TIMER -->
    <div class="recording-left">

      <div class="recording-dot"></div>

      <span id="recordingTime">
        0:00
      </span>

    </div>

    <!-- WAVES -->
    <canvas 
      id="waveCanvas" 
      width="140" 
      height="35">
    </canvas>

    <!-- SEND -->
    <button id="sendVoiceBtn" class="chat-action-btn">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <path d="M3.4 20.4 20.85 12 3.4 3.6 3.3 10l12.2 2-12.2 2z"/>
      </svg>

    </button>

  </div>

</div>
        
  <div id="recordingUI">

    <div class="recording-left">
      <i class="fas fa-microphone"></i>
      <span id="recordingTime">0:00</span>
    </div>

    <div class="wave-bars">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="slide-cancel">
      ← Slide to cancel
    </div>

  </div>

  <button id="micBtn">
    <i class="fas fa-microphone"></i>
  </button>

</div>

          <!-- IMAGE -->
          <button
            class="chat-action-btn"
            onclick="document.getElementById('imageInput').click()"
          >
            <i class="fa-solid fa-image"></i>
          </button>

          <!-- FILE -->
          <button
            class="chat-action-btn"
            onclick="document.getElementById('fileInput').click()"
          >
            <i class="fa-solid fa-paperclip"></i>
          </button>

          <!-- INPUT -->
          <input
            type="text"
            id="chatInput"
            placeholder="Message..."
            oninput="handleTyping()"
          >

          <!-- MIC -->
          
          <!-- SEND -->
          <button
            class="chat-action-btn"
            onclick="sendMessage()"
          >
            <i class="fa-solid fa-paper-plane"></i>
          </button>

          <!-- HIDDEN INPUTS -->
          <input type="file" id="imageInput" hidden>

          <input type="file" id="fileInput" hidden>

        </div>

      </div>

    </div>

  </div>

</div>

  <!-- SETTINGS -->
<div id="settingsView" style="display:none;">

  <div class="settings-box">

    <h2>Settings</h2>

    <button onclick="logout()" class="settings-btn">
      Logout
    </button>

  </div>

</div>


<!-- NOTIFICATIONS -->
<div id="notificationView" style="display:none;">

  <div id="notificationList"></div>

</div>
  <!-- RIGHT SIDEBAR -->




</div>

<div id="profileModal" class="profile-modal" style="display:none;">

  <div class="profile-content">

    <span class="close-profile" onclick="closeProfile()">✖</span>

    <div class="profile-cover"></div>

    <img
      id="profileModalPic"
      class="profile-big-pic"
      src="https://i.imgur.com/HeIi0wU.png"
    />

    <h2 id="profileModalName"></h2>

    <div class="profile-actions">

      <button id="addFriendBtn">
        Add Friend
      </button>

      <button
        class="change-photo-btn"
        onclick="document.getElementById('profilePicInput').click()"
      >
        Change Photo
      </button>

    </div>

    <input type="file" id="profilePicInput" hidden>

    <div id="profilePosts"></div>

  </div>

</div>

<!-- FACEBOOK POST MODAL -->

<div id="postModal" class="post-modal">

  <div class="post-modal-content">

    <div class="post-modal-header">

      <h2>Create Post</h2>

      <span onclick="closePostModal()">✖</span>

    </div>

    <div class="post-user-info">

      <img
        src="https://i.imgur.com/HeIi0wU.png"
        class="fb-post-avatar"
      >

      <div>

        <b id="postUsername"></b>

        <div class="post-public">
          🌍 Public
        </div>

      </div>

    </div>

    <textarea
      id="postInput"
      placeholder="What's on your mind?"
    ></textarea>

    <div id="previewArea"></div>

    <div class="post-upload-box">

      <label class="upload-option">
        📷 Photo
        <input type="file" id="postImage" hidden>
      </label>

      <label class="upload-option">
        🎥 Video
        <input type="file" id="postVideo" hidden>
      </label>

    </div>

    <button class="submit-post-btn" onclick="createPost()">
      Post
    </button>

  </div>

</div>

<div id="imageViewer" class="image-viewer" style="display:none;">

  <span onclick="closeImageViewer()">✖</span>

  <img id="viewerImage">

</div>
<!-- SOCKET -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="script.js"></script>


</body>
</html>
