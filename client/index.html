<body>

<!-- SPLASH -->
<div id="splashScreen">
  <img src="logo.png" class="splash-logo" />
  <h2>FutureBook</h2>
</div>

<!-- AUTH -->
<div id="authScreen">
  <div class="auth-logo">
    <img src="logo.png">
    <h2>FutureBook</h2>
  </div>

  <input id="nameInput" placeholder="Enter your name" />
  <input id="passwordInput" type="password" placeholder="Password" />

  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Login</button>
</div>

<!-- APP -->
<div class="app" style="display:none;">

  <!-- LEFT NAV -->
  <div class="fb-left">
    <i class="fa-solid fa-house" onclick="showHome()"></i>
    <i class="fa-solid fa-comment" onclick="showMessages()"></i>
    <i class="fa-solid fa-bell" onclick="showNotificationsPage()"></i>
    <i class="fa-solid fa-user" onclick="showProfile()"></i>
  </div>

  <!-- CENTER -->
  <div class="fb-center">

    <div id="homeView"></div>

    <div id="chatView" style="display:none;"></div>

    <div id="notificationView" style="display:none;">
      <div id="notificationList"></div>
    </div>

    <div id="profileView" style="display:none;"></div>

  </div>

  <!-- RIGHT -->
  <div class="fb-right">
    <h3>Online Users</h3>
    <div id="onlineUsers"></div>
  </div>

</div>

<!-- PROFILE MODAL (FIXED) -->
<div id="profileModal" class="profile-modal">
  <div class="profile-content">
    <span class="close-profile" onclick="closeProfile()">✖</span>

    <div class="profile-cover"></div>

    <img id="profileModalPic"
         class="profile-big-pic"
         src="https://i.imgur.com/HeIi0wU.png" />

    <h2 id="profileModalName"></h2>

    <button id="addFriendBtn">Add Friend</button>
  </div>
</div>

<!-- SETTINGS -->
<div id="settingsPanel" class="settings-panel">
  <h3>Settings</h3>
  <button onclick="logout()">Logout</button>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="script.js"></script>

</body>
