<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>FutureBook ⚡</title>

  <link rel="stylesheet" href="style.css"/>

  <!-- FONT AWESOME -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- ================= AUTH ================= -->
<div id="authScreen">

  <h2>⚡ FutureBook</h2>

  <input id="nameInput" placeholder="Enter your name" />

  <input id="passwordInput"
         type="password"
         placeholder="Password" />

  <button onclick="signup()">Create Account</button>

  <button onclick="login()">Login</button>

</div>

<!-- ================= MAIN APP ================= -->
<div class="app" style="display:none;">

  <!-- ================= SIDEBAR ================= -->
  <div class="sidebar">

    <div class="logo">⚡ FutureBook</div>

    <div class="menu-item">
      <i class="fa-solid fa-house"></i>
      Home
    </div>

    <div class="menu-item">
      <i class="fa-solid fa-user"></i>
      Profile
    </div>

    <div class="menu-item">
      <i class="fa-solid fa-message"></i>
      Messages
    </div>

    <div class="menu-item">
      <i class="fa-solid fa-bell"></i>
      Notifications
    </div>

    <div class="menu-item">
      <i class="fa-solid fa-gear"></i>
      Settings
    </div>

  </div>

  <!-- ================= FEED ================= -->
  <div class="feed">

    <div class="topbar">
      <input class="search"
             placeholder="Search FutureBook..." />
    </div>

    <!-- CREATE POST -->
    <div class="create-post">

      <input id="postInput"
             placeholder="What's on your mind?" />

      <button onclick="createPost()">Post</button>

    </div>

    <!-- POSTS -->
    <div id="posts"></div>

  </div>

  <!-- ================= CHAT PANEL ================= -->
  <div class="rightbar" id="chatPanel">

    <!-- ONLINE USERS -->
    <h3 style="padding:10px;">🟢 Online Users</h3>

    <div id="onlineUsers"></div>

    <!-- CHAT HEADER -->
    <div class="chat-header">

      <div class="chat-user-info">

     <img id="profilePreview"
     class="chat-avatar"
     src="https://i.imgur.com/HeIi0wU.png" />
<input type="file"
       id="profileInput"
       hidden
       onchange="uploadProfilePic()" />

<button onclick="document.getElementById('profileInput').click()">
  Change Photo
</button>

        <div>
          <div id="chatTitle">Select a user</div>
          <small id="userStatus">offline</small>
        </div>

      </div>

    </div>

    <!-- CHAT BOX -->
    <div id="chatBox" class="chat-box">

      <!-- MESSAGES -->
      <div id="messagesContainer"></div>

      <!-- TYPING -->
      <div id="typingIndicator"
           class="typing-bubble"></div>

    </div>

    <!-- CHAT INPUT -->
    <div class="chat-input">

      <input id="chatInput"
             placeholder="Type message..."
             oninput="handleTyping()" />

      <button onclick="startRecording()">
        <i class="fa-solid fa-microphone"></i>
      </button>

      <button onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
      </button>

    </div>

  </div>

</div>

<!-- ================= MOBILE NAV ================= -->
<div class="mobile-nav">

  <div onclick="showFeed()">
    <i class="fa-solid fa-house"></i>
  </div>

  <div onclick="toggleChat()">
    <i class="fa-solid fa-message"></i>
  </div>

  <div onclick="logout()">
    <i class="fa-solid fa-right-from-bracket"></i>
  </div>

</div>

<!-- ================= SOCKET ================= -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

<!-- ================= SCRIPT ================= -->
<script src="script.js"></script>

</body>
</html>
