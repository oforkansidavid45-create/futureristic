<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FutureBook ⚡</title>

<link rel="stylesheet" href="style.css"/>

<!-- FONT AWESOME (Facebook-style icons) -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- ================= SPLASH SCREEN ================= -->
<div id="splashScreen">
  <img src="logo.png" class="splash-logo" />
  <h2>FutureBook</h2>
</div>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="auth-logo">
    <img src="logo.png">
    <h2>FutureBook</h2>
  </div>

  <input id="nameInput" placeholder="Enter your name" />
  <input id="passwordInput" type="password" placeholder="Password" />

  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Login</button>
</div>



<!-- ================= APP ================= -->
<div class="app" id="app" style="display:none;">

 
<!-- FACEBOOK TOP BAR -->

<div class="top-navbar">
  <button onclick="showReels()">
🎬 Reels
</button>

  <div class="nav-left">
    <h2>FutureBook</h2>
  </div>

  <div class="nav-center">

    <input
      type="text"
      id="mainSearch"
      placeholder="Search FutureBook"
      onkeyup="searchUsersMain()"
    >

  </div>

  <div class="nav-right">

    <div onclick="showHome()">
      <i class="fa-solid fa-house"></i>
    </div>

    <div onclick="showMessages()">
      <i class="fa-solid fa-message"></i>
    </div>

    <div onclick="showNotificationsPage()">
      <i class="fa-solid fa-bell"></i>
    </div>

    <div onclick="showProfile()">
      <i class="fa-solid fa-user"></i>
    </div>

  </div>

</div>

<div id="searchResults"></div>
<!-- CENTER -->
<div class="fb-center">




  <!-- HOME -->
  <div id="homeView">

    <!-- NOVA / STORIES -->
    <div class="nova-bar">

      <div class="nova-card create-nova">
        <div class="nova-plus">+</div>
        <span>Create Nova</span>
      </div>

    </div>
    <div id="reelsView" style="display:none;">

<div id="reelsContainer"></div>

</div>

    <!-- CREATE POST -->
<div class="fb-post-box" onclick="openPostModal()">

  <div class="fb-post-top">

    <img
      src="https://i.imgur.com/HeIi0wU.png"
      class="fb-post-avatar"
    >

    <input
      type="text"
      placeholder="What's on your mind?"
      readonly
    >

  </div>

  <div class="fb-post-bottom">

    <div class="fb-post-action live">
      🎥 Live Video
    </div>

    <div class="fb-post-action photo">
      📷 Photo/video
    </div>

    <div class="fb-post-action feeling">
      😊 Feeling/activity
    </div>

  </div>

</div>

    <!-- POSTS -->
    <div id="posts"></div>

  </div>

  <!-- CHAT -->
  <div id="chatView" style="display:none;">
<div id="friendsList" class="friends-list"></div>

  </div>

  <!-- RIGHT SIDEBAR -->




</div>

<div id="profileModal" class="profile-modal" style="display:none;">

  <div class="profile-content">

    <span class="close-profile" onclick="closeProfile()">✖</span>

    <div class="profile-cover"></div>

    <img
      id="profileModalPic"
      class="profile-big-pic"
      src="https://i.imgur.com/HeIi0wU.png"
    />

    <h2 id="profileModalName"></h2>

    <div class="profile-actions">

      <button id="addFriendBtn">
        Add Friend
      </button>

      <button
        class="change-photo-btn"
        onclick="document.getElementById('profilePicInput').click()"
      >
        Change Photo
      </button>

    </div>

    <input type="file" id="profilePicInput" hidden>

    <div id="profilePosts"></div>

  </div>

</div>

<!-- FACEBOOK POST MODAL -->

<div id="postModal" class="post-modal">

  <div class="post-modal-content">

    <div class="post-modal-header">

      <h2>Create Post</h2>

      <span onclick="closePostModal()">✖</span>

    </div>

    <div class="post-user-info">

      <img
        src="https://i.imgur.com/HeIi0wU.png"
        class="fb-post-avatar"
      >

      <div>

        <b id="postUsername"></b>

        <div class="post-public">
          🌍 Public
        </div>

      </div>

    </div>

    <textarea
      id="postInput"
      placeholder="What's on your mind?"
    ></textarea>

    <div id="previewArea"></div>

    <div class="post-upload-box">

      <label class="upload-option">
        📷 Photo
        <input type="file" id="postImage" hidden>
      </label>

      <label class="upload-option">
        🎥 Video
        <input type="file" id="postVideo" hidden>
      </label>

    </div>

    <button class="submit-post-btn" onclick="createPost()">
      Post
    </button>

  </div>

</div>
<!-- SOCKET -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="script.js"></script>


</body>
</html>
