<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>FutureBook ⚡</title>

<link rel="stylesheet" href="style.css"/>

<!-- FONT AWESOME (Facebook-style icons) -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- ================= SPLASH SCREEN ================= -->
<div id="splashScreen">
  <img src="logo.png" class="splash-logo" />
  <h2>FutureBook</h2>
</div>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen">
  <div class="auth-logo">
    <img src="logo.png">
    <h2>FutureBook</h2>
  </div>

  <input id="nameInput" placeholder="Enter your name" />
  <input id="passwordInput" type="password" placeholder="Password" />

  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Login</button>
</div>



<!-- ================= APP ================= -->
<div class="app" id="app" style="display:none;">

  <!-- LEFT SIDEBAR -->
  <div class="fb-left">

    <div class="menu-item" onclick="showHome()">
      <i class="fa-solid fa-house"></i>
    </div>

    <div class="menu-item" onclick="showMessages()">
      <i class="fa-solid fa-message"></i>
    </div>

    <div class="menu-item" onclick="showNotificationsPage()">
      <i class="fa-solid fa-bell"></i>
    </div>

    <div class="menu-item" onclick="showProfile()">
      <i class="fa-solid fa-user"></i>
    </div>

    <div class="menu-item" onclick="showSettings()">
      <i class="fa-solid fa-gear"></i>
    </div>

  </div>
<!-- CENTER -->
<div class="fb-center">

  <!-- HOME -->
  <div id="homeView">

    <!-- NOVA / STORIES -->
    <div class="nova-bar">

      <div class="nova-card create-nova">
        <div class="nova-plus">+</div>
        <span>Create Nova</span>
      </div>

    </div>

    <!-- CREATE POST -->
<div class="create-post">

  <img
    src="https://i.imgur.com/HeIi0wU.png"
    class="create-avatar"
  >

  <div class="create-post-right">

    <input
      id="postInput"
      placeholder="What's on your mind?"
    />

    <div class="post-actions">

      <label class="post-btn">
        📷 Photo
        <input
          type="file"
          id="postImage"
          hidden
        >
      </label>

      <label class="post-btn">
        🎥 Video
        <input
          type="file"
          id="postVideo"
          hidden
        >
      </label>

      <button onclick="createPost()">
        Post
      </button>

    </div>

  </div>

</div>

    <!-- POSTS -->
    <div id="posts"></div>

  </div>

  <!-- CHAT -->
  <div id="chatView" style="display:none;">

    <div id="friendsList"></div>

    <div id="chatArea" style="display:none;">

      <div class="chat-header">
        <h3 id="chatTitle"></h3>
      </div>

      <div id="messagesContainer"></div>

      <div id="typingIndicator"></div>

      <div class="chat-input-area" id="chatInputArea">

        <input
          id="chatInput"
          placeholder="Type message..."
          oninput="handleTyping()"
        />

        <button onclick="sendMessage()">
          <i class="fa fa-paper-plane"></i>
        </button>

      </div>

    </div>

  </div>

  <!-- NOTIFICATION -->
  <div id="notificationView" style="display:none;">
    <h2>Notifications</h2>
    <div id="notificationList"></div>
  </div>

  <!-- PROFILE -->
  <div id="profileView" style="display:none;">
    <h2>Profile</h2>
    <div id="profileContent"></div>
  </div>

  <!-- SETTINGS -->
  <div id="settingsView" style="display:none;">

    <div class="settings-page">

      <h2>Settings</h2>

      <button onclick="logout()">
        Logout
      </button>

    </div>

  </div>

</div>
    <!-- CHAT -->
   

   <div id="friendsList"></div>

      <div id="chatArea" style="display:none;">

        <div class="chat-header">
          <h3 id="chatTitle"></h3>
        </div>

        <div id="messagesContainer"></div>

        <div id="typingIndicator"></div>

        <div class="chat-input-area">

          <input
            id="chatInput"
            placeholder="Type message..."
            oninput="handleTyping()"
          />

          <button onclick="sendMessage()">
            <i class="fa fa-paper-plane"></i>
          </button>

        </div>

      </div>

    </div>

    <!-- NOTIFICATIONS -->
    <div id="notificationView" style="display:none;">
      <h2>Notifications</h2>
      <div id="notificationList"></div>
    </div>

<!-- PROFILE -->
<div id="profileView" style="display:none;">

  <h2>Profile</h2>

  <div id="profileContent"></div>

</div>

  </div>

  <!-- RIGHT SIDEBAR -->
<!-- RIGHT SIDEBAR -->
<div class="fb-right">

  <div class="right-header">
    <h3>Friends</h3>
  </div>

  <input
    type="text"
    id="friendSearch"
    placeholder="Search friends..."
    onkeyup="searchFriends()"
  >

  <div id="onlineUsers"></div>

</div>

</div>

<div id="profileModal" class="profile-modal" style="display:none;">

  <div class="profile-content">

    <span class="close-profile" onclick="closeProfile()">✖</span>

    <div class="profile-cover"></div>

    <img
      id="profileModalPic"
      class="profile-big-pic"
      src="https://i.imgur.com/HeIi0wU.png"
    />

    <h2 id="profileModalName"></h2>

    <div class="profile-actions">

      <button id="addFriendBtn">
        Add Friend
      </button>

      <button
        class="change-photo-btn"
        onclick="document.getElementById('profilePicInput').click()"
      >
        Change Photo
      </button>

    </div>

    <input type="file" id="profilePicInput" hidden>

    <div id="profilePosts"></div>

  </div>

</div>
<!-- SOCKET -->
<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="script.js"></script>


</body>
</html>
