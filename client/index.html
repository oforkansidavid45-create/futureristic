
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>FutureBook ⚡</title>

  <link rel="stylesheet" href="style.css"/>

  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<!-- IMAGE VIEWER -->
<div id="imageViewer" class="image-viewer">
  <span class="close-viewer" onclick="closeImageViewer()">✕</span>
  <img id="viewerImage">
</div>

<!-- AUTH SCREEN -->
<div id="authScreen">
<div class="auth-logo">

  <img src="logo.png">

  <h2>FutureBook</h2>

</div>

  <input id="nameInput" placeholder="Enter your name" />
  <input id="passwordInput" type="password" placeholder="Password" />

  <button onclick="signup()">Create Account</button>
  <button onclick="login()">Login</button>
</div>

<!-- MAIN APP -->
<div class="app" style="display:none;">

  <!-- TOP NAVBAR (FACEBOOK STYLE) -->
  <div class="fb-navbar">

    <div class="fb-logo">
      FutureBook
    </div>

    <div class="fb-nav-icons">

      <button onclick="showHome()">Home</button>

      <button onclick="showMessages()">Messages</button>

      <button onclick="showNotificationsPage()">Notifications</button>

    </div>

    <div class="fb-profile">
      <img id="profilePreview" onclick="showProfile()" />
    </div>

  </div>

  <!-- MAIN LAYOUT -->
  <div class="fb-layout">
    <!-- RIGHT SIDEBAR -->
<div class="fb-right">

  <h3>Online Users</h3>

  <div id="onlineUsers"></div>

</div>

    <!-- LEFT SIDEBAR -->
    <div class="fb-left">

      <div class="menu-item" onclick="showHome()">Home</div>
      <div class="menu-item" onclick="showProfile()">Profile</div>
      <div class="menu-item" onclick="showMessages()">Messages</div>
      <div class="menu-item" onclick="showNotificationsPage()">Notifications</div>
      <div class="menu-item" onclick="toggleSettings()">Settings</div>

    </div>

    <!-- CENTER CONTENT -->
    <div class="fb-center" id="mainContent">

<!-- CHAT PAGE -->
<div id="chatPage" style="display:none;">

  <div class="chat-header">
    <h3 id="chatTitle">Chat</h3>
  </div>

  <div id="messagesContainer" class="messages-container"></div>

  <div id="typingIndicator" class="typing"></div>

<div class="chat-input-area" id="chatInputArea" style="display:none;"></div>

    <input
      id="chatInput"
      placeholder="Type message..."
      oninput="handleTyping()"
    />

    <input
      type="file"
      id="imageInput"
      accept="image/*"
      hidden
    />

    <input
      type="file"
      id="fileInput"
      hidden
    />

    <button onclick="sendMessage()">Send</button>

    <button
      onclick="document.getElementById('imageInput').click()"
    >
      📷
    </button>

    <button
      onclick="document.getElementById('fileInput').click()"
    >
      📎
    </button>

    <button onclick="startRecording()">
      🎤
    </button>

  </div>

</div>

<!-- NOTIFICATIONS PAGE -->
<div id="notificationsPage" style="display:none;">

  <h2>Notifications</h2>

<div id="sidebarNotifications"></div>

</div>


      <!-- STORIES -->
      <div id="storiesBar" class="stories-bar"></div>

      <!-- HOME FEED -->
      <div id="homeFeed">

        <div class="topbar">
          <input class="search" placeholder="Search FutureBook..." />
        </div>

        <div class="create-post">
          <input id="postInput" placeholder="What's on your mind?" />
          <button onclick="createPost()">Post</button>
        </div>

        <div id="posts"></div>

      </div>

    </div>

    <!-- RIGHT SIDEBAR -->
  
    </div>
  </div>
<!-- PROFILE MODAL -->
<div id="profileModal" class="profile-modal">

  <div class="profile-content">

    <span class="close-profile" onclick="closeProfile()">✖</span>

    <div class="profile-cover"></div>

    <img id="profileModalPic"
         class="profile-big-pic"
         src="https://i.imgur.com/HeIi0wU.png" />

    <h2 id="profileModalName"></h2>

    <div class="profile-actions">
      <button id="addFriendBtn">Add Friend</button>
    </div>

    <div id="profilePosts"></div>

  </div>

</div>

<!-- SETTINGS -->
<div id="settingsPanel" class="settings-panel">
  <h3>Settings</h3>
  <button onclick="logout()">Logout</button>
</div>

<!-- SOCKET -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<script src="script.js"></script>

</body>
</html>
